version: 2

sources:
  - name: bronze
    database: "{{ var('bronze_catalog') }}"
    schema: "{{ var('bronze_schema') }}"
    description: >
      Superstore CSV file (Kaggle vivek468/superstore-dataset-final) pushed to RustFS by the
      download_superstore_to_s3 task. External table created by the create_bronze macro.
    tables:
      - name: superstore_raw
        description: "1 row = 1 order line. CSV with a header (skipped), converted to UTF-8. All columns are varchar."
        columns:
          - name: row_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]
          - name: order_date
            description: "Format M/D/YYYY"
          - name: ship_date
            description: "Format M/D/YYYY"
          - name: ship_mode
          - name: customer_id
          - name: customer_name
          - name: segment
          - name: country
          - name: city
          - name: state
          - name: postal_code
          - name: region
          - name: product_id
          - name: category
          - name: sub_category
          - name: product_name
          - name: sales
          - name: quantity
          - name: discount
          - name: profit
