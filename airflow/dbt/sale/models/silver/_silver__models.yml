version: 2

models:
  - name: superstore_orders
    description: >
      Superstore order lines with typed columns, parsed dates, null -> 0 for measures, deduplicated by row_id.
    columns:
      - name: row_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: ship_date
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [Consumer, Corporate, Home Office]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: [Central, East, South, West]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [Furniture, Office Supplies, Technology]
      - name: sales
        description: Order line revenue (USD), after discount
      - name: discount
        description: Discount rate 0..1
      - name: profit
        description: Profit (USD), can be negative
      - name: source_file
        description: Raw file on RustFS this row came from
