version: 2

models:
  - name: sales
    description: >
      Fact table for Cube (cube sales): 1 row = 1 Superstore order line (US, 2014–2017),
      with customer, geography and product information.
    columns:
      - name: row_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: days_to_ship
        description: Days from order to shipment (ship_date - order_date)
