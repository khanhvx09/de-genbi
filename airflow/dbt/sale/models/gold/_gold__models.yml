version: 2

models:
  - name: sales
    description: >
      Fact cho Cube (cube sales): 1 dòng = 1 order line Superstore (Mỹ, 2014–2017),
      kèm thông tin khách hàng, địa lý và sản phẩm.
    columns:
      - name: row_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: days_to_ship
        description: Số ngày từ lúc đặt tới lúc giao (ship_date - order_date)
