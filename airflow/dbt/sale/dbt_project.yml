# Medallion on Trino, one schema per layer:
#   bronze : hive.bronze.superstore_raw (catalog `hive`, CSV so it needs the Hive connector) — raw CSV file on RustFS (s3://lakehouse/raw/superstore) pushed by task
#            download_superstore_to_s3; macro create_bronze creates the external table
#   silver : delta.silver.superstore_orders — typed (catalog `delta`, Delta Lake), dedup, parsed dates
#   gold   : delta.gold.sales — read directly by Cube
name: 'sale'
version: '1.0.0'
profile: 'sale'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  lake_root: "s3://lakehouse"              # schema <catalog>.<x> lives at <lake_root>/<x>/
  raw_superstore_location: "s3://lakehouse/raw/superstore"
  bronze_schema: "bronze"
  bronze_catalog: "hive"                  # bronze is a CSV external table -> only the Hive connector can create it; silver/gold use the default catalog (delta) from profiles.yml

on-run-start:
  - "{{ create_bronze() }}"

models:
  sale:
    +materialized: table
    # The Delta connector supports CREATE OR REPLACE TABLE
    +on_table_exists: replace
    silver:
      +schema: silver
      +tags: ["silver"]
    gold:
      +schema: gold
      +tags: ["gold"]
