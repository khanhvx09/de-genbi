# Medallion trên Trino, mỗi layer 1 schema:
#   bronze : hive.bronze.superstore_raw (catalog `hive`, CSV nên cần Hive connector) — file CSV thô trên RustFS (s3://lakehouse/raw/superstore) do task
#            download_superstore_to_s3 đẩy lên; macro create_bronze tạo external table
#   silver : delta.silver.superstore_orders — typed (catalog `delta`, Delta Lake), dedup, parse ngày
#   gold   : delta.gold.sales — Cube đọc trực tiếp
name: 'sale'
version: '1.0.0'
profile: 'sale'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  lake_root: "s3://lakehouse"              # schema <catalog>.<x> nằm ở <lake_root>/<x>/
  raw_superstore_location: "s3://lakehouse/raw/superstore"
  bronze_schema: "bronze"
  bronze_catalog: "hive"                  # bronze là CSV external table -> chỉ Hive connector tạo được; silver/gold dùng catalog mặc định (delta) ở profiles.yml

on-run-start:
  - "{{ create_bronze() }}"

models:
  sale:
    +materialized: table
    # Delta connector hỗ trợ CREATE OR REPLACE TABLE
    +on_table_exists: replace
    silver:
      +schema: silver
      +tags: ["silver"]
    gold:
      +schema: gold
      +tags: ["gold"]
