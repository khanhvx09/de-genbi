# dbt profile for Trino. Default catalog `delta` (silver/gold). Exception: bronze CSV lives in catalog `hive`, set via var bronze_catalog in dbt_project.yml.
# Run: dbt debug --profiles-dir .   (or export DBT_PROFILES_DIR=/opt/airflow/dbt/sale)
#   - target `dev`    : run from the host machine, Trino exposed at localhost:8085
#   - target `docker` : run inside the Airflow container, reaching Trino over the internal network
sale:
  target: "{{ env_var('DBT_TARGET', 'docker') }}"
  outputs:
    dev:
      type: trino
      method: none            # local Trino has no auth enabled
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8085') | int }}"
      http_scheme: http
      database: delta         # = Trino catalog
      schema: default         # default schema; the silver/gold folders set their own +schema
      threads: 4
      session_properties:
        query_max_run_time: 30m

    docker:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_INTERNAL_PORT', '8080') | int }}"
      http_scheme: http
      database: delta
      schema: default
      threads: 4
      session_properties:
        query_max_run_time: 30m
