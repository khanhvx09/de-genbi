volumes:
  metastore_db_data:
  cubestore:
  superset-home:

# Named explicitly (instead of the default project-prefixed name) so
# docker-compose-airflow.yaml can join it as an external network and reach
# metastore-db by service name.
networks:
  default:
    name: data-platform-net
