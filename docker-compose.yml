  # cubestore-worker-1:
  #   image: cubejs/cubestore:${CUBE_VERSION:-latest}
  #   container_name: cubestore-worker-1
  #   environment:
  #     CUBESTORE_SERVER_NAME: cubestore-worker-1:10001
  #     CUBESTORE_WORKER_PORT: 10001
  #     CUBESTORE_WORKERS: cubestore-worker-1:10001
  #     CUBESTORE_META_ADDR: cubestore-router:9999
  #     CUBESTORE_REMOTE_DIR: /cube/data
  #   volumes:
  #     - cubestore:/cube/data
  #   depends_on:
  #     - cubestore-router

  cube:
    image: cubejs/cube:${CUBE_VERSION:-latest}
    container_name: cube
    ports:
      - "4000:4000"     # REST/GraphQL API + Playground (dev mode)
      - "15432:15432"   # SQL API (Postgres wire) -> Superset/BI
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: trino
      CUBEJS_DB_HOST: trino
      CUBEJS_DB_PORT: 8080
      CUBEJS_DB_USER: cube
      CUBEJS_DB_PRESTO_CATALOG: delta      # silver/gold live in the delta catalog
      CUBEJS_DB_SCHEMA: gold
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-dev-secret-change-me}
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: ${CUBE_SQL_USER:-cube}
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:-cube}
      CUBEJS_SCHEDULED_REFRESH_DEFAULT: "true"
      CUBEJS_SCHEDULED_REFRESH_TIMEZONES: Asia/Singapore
    volumes:
      - ./cube:/cube/conf
    depends_on:
      trino:
        condition: service_healthy

  # Agent + UI trong một app Streamlit (app/app.py); chạy local: streamlit run app/app.py
  genbi:
    build: ./app
    container_name: genbi
    ports:
      - "8501:8501"
    env_file: [.env]
    environment:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-dev-secret-change-me}
      # Bỏ comment để trí nhớ bền qua restart (mặc định in-memory):
      # AGENT_DB_URI: postgresql://agent:agent@metastore-db:5432/agent
    depends_on:
      - cube

  # # Connects to Cube's SQL API (cube:15432, user/pass from CUBE_SQL_*)
