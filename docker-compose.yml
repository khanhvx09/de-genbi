services:
  spark-master:
    image: deltaio/delta-docker:4.3.1
    container_name: spark-master
    entrypoint: ["bash", "/opt/startup.sh"]
    environment:
      # Spark lineage -> DataHub (docker-compose-datahub.yaml). Set to empty in .env to disable.
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL-http://datahub-gms:8080}
    stdin_open: true   # docker run -i
    tty: true          # docker run -t
    ports:
      - "8888:8888"    # Jupyter Lab, used by startup.sh
      - "7077:7077"    # Spark RPC, used by spark-worker
      - "8080:8080"    # Spark master Web UI
      - "4040:4040"    # Spark Application UI (active job/SQL/stages)
    volumes:
      - ./startup.sh:/opt/startup.sh:ro
      - ./requirements.txt:/opt/requirements.txt:ro
      # Hadoop picks up fs.s3a.* from any *-site.xml under $SPARK_HOME/conf,
      # so the driver gets its RustFS/S3A settings from here instead of a
      # wall of --conf spark.hadoop.fs.s3a.* flags in startup.sh.
      - ./hive-metastore/core-site.xml:/opt/spark/conf/core-site.xml:ro
      # Driver-side only (lineage listener runs in the driver); executors keep Spark's defaults.
      - ./spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./demo:/opt/work
    working_dir: /opt
    depends_on:
      - hive-metastore

  spark-worker:
    image: deltaio/delta-docker:4.3.1
    container_name: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_DIR: /tmp/spark-work    # /opt/spark isn't writable by NBuser
    volumes:
      # Executors read Hadoop config from their own local $SPARK_HOME/conf,
      # not from the driver's — needs the same file here too.
      - ./hive-metastore/core-site.xml:/opt/spark/conf/core-site.xml:ro
    depends_on:
      - spark-master
    ports:
      - "8081:8081"    # Spark worker Web UI
      - "4041:4040"    # Spark driver UI (cluster-mode driver lands here — single worker)

  rustfs:
    # RustFS: object storage tương thích S3 (Rust). Chỉ hỗ trợ path-style -> client phải bật path-style.
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    container_name: rustfs
    hostname: rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web console
    volumes:
      - ./data_platform/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Shared Postgres server: hive metastore DB (hive/hive), the agent's LangGraph
  # checkpointer DB (agent/agent) and Airflow's metadata DB (airflow/airflow,
  # used by docker-compose-airflow.yaml). agent/airflow are created by ./initdb.
  metastore-db:
    image: postgres:15
    container_name: metastore-db
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"    # Postgres
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
      # Only runs when the data volume is empty
      - ./initdb:/docker-entrypoint-initdb.d:ro

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/hive
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
      # Puts the S3A + AWS SDK jars (already bundled under Hadoop's tools/lib)
      # on the metastore's classpath so it can create/validate s3a:// locations.
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
    ports:
      - "9083:9083"    # Thrift metastore API
    volumes:
      - ./drivers/postgresql.jar:/opt/hive/lib/postgresql.jar:ro
      - ./hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    depends_on:
      metastore-db:
        condition: service_healthy

  # Trino -> DataHub lineage: renames OpenLineage jobs to one job per output table (see relay.py)
  lineage-relay:
    image: python:3.12-alpine
    container_name: lineage-relay
    command: python /app/relay.py
    environment:
      DATAHUB_OPENLINEAGE_URL: ${DATAHUB_OPENLINEAGE_URL:-http://datahub-gms:8080/openapi/openlineage/api/v1/lineage}
    volumes:
      - ./trino/lineage-relay/relay.py:/app/relay.py:ro
    restart: unless-stopped

  trino:
    image: trinodb/trino:${TRINO_VERSION:-latest}
    container_name: trino
    hostname: trino
    ports:
      - "${TRINO_PORT:-8085}:8080"   # 8080 is taken by the Spark master UI
    environment:
      # Read by trino/catalog/hive.properties via ${ENV:...}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/openlineage-event-listener.properties:/etc/trino/openlineage-event-listener.properties:ro
    # Without a limit the JVM sizes its heap at 80% of the whole Docker VM and gets OOM-killed
    mem_limit: 3g
    restart: unless-stopped
    depends_on:
      - hive-metastore
      - rustfs
    # trinodb/trino ships its own HEALTHCHECK (/usr/lib/trino/bin/health-check)

  # cubestore-router:
  #   image: cubejs/cubestore:${CUBE_VERSION:-latest}
  #   container_name: cubestore-router
  #   environment:
  #     CUBESTORE_SERVER_NAME: cubestore-router:9999
