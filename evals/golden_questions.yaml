# Golden set: câu hỏi -> các member Cube BẮT BUỘC phải xuất hiện trong query agent sinh ra.
# Mở rộng dần bằng câu hỏi thật của người dùng. Mỗi lần agent sai 2 lần cùng kiểu -> thêm 1 case.
- id: q01
  question: Vùng nào có doanh thu cao nhất trong năm 2017?
  must_include: [superstore_sales.total_sales, superstore_sales.region]
  date_range: ["2017-01-01", "2017-12-31"]
- id: q02
  question: Vẽ xu hướng doanh thu theo tháng
  must_include: [superstore_sales.total_sales, superstore_sales.order_date]
  granularity: month
- id: q03
  question: Ngành hàng nào có biên lợi nhuận thấp nhất?
  must_include: [superstore_sales.profit_margin, superstore_sales.category]
- id: q04
  question: So sánh lợi nhuận giữa các phân khúc khách hàng
  must_include: [superstore_sales.total_profit, superstore_sales.segment]
- id: q05
  question: Top 10 sản phẩm lỗ nhiều nhất
  must_include: [superstore_sales.total_profit, superstore_sales.product_name]
  limit: 10
- id: q06
  question: What was the profit margin of Technology in the West region?
  must_include: [superstore_sales.profit_margin, superstore_sales.category, superstore_sales.region]
- id: q07
  question: Doanh thu nội thất theo quý
  must_include: [superstore_sales.total_sales, superstore_sales.category, superstore_sales.order_date]
  granularity: quarter
- id: q08
  question: Có bao nhiêu đơn hàng trong năm 2016?
  must_include: [superstore_sales.order_count]
- id: q09
  question: Lưu lượng data 4G tháng 11 là bao nhiêu?   # không có metric -> agent phải từ chối đúng cách
  must_include: []
  expect_no_query: true
- id: q10
  question: Bang nào có mức giảm giá trung bình cao nhất?
  must_include: [superstore_sales.avg_discount, superstore_sales.state]
