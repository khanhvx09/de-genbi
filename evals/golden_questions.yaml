# Golden set: question -> Cube members that MUST appear in the query the agent generates.
# Grow it with real user questions. Each time the agent gets the same kind of question wrong twice -> add a case.
- id: q01
  question: Which region had the highest revenue in 2017?
  must_include: [superstore_sales.total_sales, superstore_sales.region]
  date_range: ["2017-01-01", "2017-12-31"]
- id: q02
  question: Plot the monthly revenue trend
  must_include: [superstore_sales.total_sales, superstore_sales.order_date]
  granularity: month
- id: q03
  question: Which category has the lowest profit margin?
  must_include: [superstore_sales.profit_margin, superstore_sales.category]
- id: q04
  question: Compare profit across customer segments
  must_include: [superstore_sales.total_profit, superstore_sales.segment]
- id: q05
  question: Top 10 most loss-making products
  must_include: [superstore_sales.total_profit, superstore_sales.product_name]
  limit: 10
- id: q06
  question: What was the profit margin of Technology in the West region?
  must_include: [superstore_sales.profit_margin, superstore_sales.category, superstore_sales.region]
- id: q07
  question: Furniture revenue by quarter
  must_include: [superstore_sales.total_sales, superstore_sales.category, superstore_sales.order_date]
  granularity: quarter
- id: q08
  question: How many orders were placed in 2016?
  must_include: [superstore_sales.order_count]
- id: q09
  question: What was the 4G data traffic in November?   # no such metric -> the agent must decline properly
  must_include: []
  expect_no_query: true
- id: q10
  question: Which state has the highest average discount?
  must_include: [superstore_sales.avg_discount, superstore_sales.state]
