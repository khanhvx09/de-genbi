#single node install config
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
event-listener.config-files=etc/openlineage-event-listener.properties

# Heap ~2.1GB (70% of the 3g container limit). Keep query memory below heap
# minus headroom so big windows/partitioned writes spill instead of OOM.
query.max-memory-per-node=1GB
query.max-memory=1GB
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=20GB
query-max-spill-per-node=20GB
