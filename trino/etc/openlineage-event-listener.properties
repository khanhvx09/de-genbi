# Gửi lineage của query ghi dữ liệu trên Trino sang DataHub, qua lineage-relay
# (docker-compose.yml) để mỗi bảng đích chỉ có một job thay vì một job mỗi query.
event-listener.name=openlineage
openlineage-event-listener.transport.type=HTTP
openlineage-event-listener.transport.url=http://lineage-relay:8000
openlineage-event-listener.transport.endpoint=/api/v1/lineage
# Dùng làm namespace của job; phải có scheme + host + port.
openlineage-event-listener.trino.uri=http://trino:8080
# CTAS tính là INSERT. Không gửi DDL (CREATE SCHEMA, DROP...) vì không có lineage.
openlineage-event-listener.trino.include-query-types=INSERT,UPDATE,DELETE,MERGE,ALTER_TABLE_EXECUTE
