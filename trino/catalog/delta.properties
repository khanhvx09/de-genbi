# Delta Lake on RustFS/S3, metadata via Hive Metastore. dbt writes silver/gold into this catalog.
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
# RustFS/S3 does not support atomic writes for _delta_log -> allow writes with a single writer (dbt)
delta.enable-non-concurrent-writes=true
