# Hive connector — only used to read bronze (raw CSV files on RustFS) via the external table hive.bronze.superstore_raw.
# The Delta connector cannot read CSV, so this catalog is kept; silver/gold live in the `delta` catalog.
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
