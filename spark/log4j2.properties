# Spark 4.1.1 defaults (org/apache/spark/log4j2-defaults.properties) plus the
# lineage logger at the bottom. Spark only reads this file instead of the
# defaults when it exists, so the defaults have to be repeated here.

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.repl1.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.repl1.level = info
logger.repl2.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.repl2.level = info

logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn

logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.metastore.level = fatal
logger.hive_functionregistry.name = org.apache.hadoop.hive.ql.exec.FunctionRegistry
logger.hive_functionregistry.level = error

logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error
logger.parquet2.name = parquet.CorruptStatistics
logger.parquet2.level = error

# acryl-spark-lineage logs "Query execution is null: can't emit event for
# executionId N" at ERROR whenever its listener reaches a short-lived execution
# (the sparksql magic's `take`, Delta's internal snapshot queries) after Spark
# already dropped it. The listener thread is blocked on the metastore, S3 and
# DataHub GMS, so this is expected and loses no lineage for the real statement.
# The package is shaded inside the acryl jar, hence the io.acryl.shaded prefix.
logger.openlineage_context.name = io.acryl.shaded.io.openlineage.spark.agent.lifecycle.ContextFactory
logger.openlineage_context.level = fatal
