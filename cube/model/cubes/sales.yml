cubes:
  - name: sales
    sql_table: delta.gold.sales
    title: Superstore sales
    description: >
      Kaggle Superstore — a US retail chain selling furniture, office supplies and technology,
      orders from 2014-01-03 to 2017-12-30. One row = one order line (one product in one order).
      Currency USD.

    measures:
      - name: total_sales
        sql: sales
        type: sum
        format: currency
        title: Sales
        description: Total revenue (USD, after discounts)
        meta: { synonyms: ["revenue", "sales", "turnover", "sold"] }
      - name: total_profit
        sql: profit
        type: sum
        format: currency
        title: Profit
        description: Total profit (USD), can be negative
        meta: { synonyms: ["profit", "earnings", "loss", "gain"] }
      - name: profit_margin
        sql: "1.0 * {total_profit} / NULLIF({total_sales}, 0)"
        type: number
        format: percent
        title: Profit margin
        description: Profit margin = profit / sales
        meta: { synonyms: ["profit margin", "margin", "profitability"] }
      - name: total_quantity
        sql: quantity
        type: sum
        title: Quantity
        description: Total units sold
        meta: { synonyms: ["quantity", "units", "volume"] }
      - name: order_count
        sql: order_id
        type: count_distinct
        title: Orders
        description: Number of orders (not usable with pre-aggregation)
        meta: { synonyms: ["orders", "order count", "number of orders"] }
      - name: customer_count
        sql: customer_id
        type: count_distinct
        title: Customers
        description: Number of distinct customers (not usable with pre-aggregation)
        meta: { synonyms: ["customers", "customer count", "buyers"] }
      - name: avg_discount
        sql: discount
        type: avg
        format: percent
        description: Average discount per order line (0..1)
        meta: { synonyms: ["discount", "markdown", "price cut"] }
      - name: avg_days_to_ship
        sql: days_to_ship
        type: avg
        description: Average number of days to ship
        meta: { synonyms: ["shipping time", "delivery time", "ship"] }
      - name: line_count
        type: count
        description: Number of order lines

    dimensions:
      - name: row_id
        sql: row_id
        type: number
        primary_key: true
        public: false
      - name: order_id
        sql: order_id
        type: string
      - name: order_date
        sql: order_date
        type: time
        description: Order date
        meta: { synonyms: ["order date", "date", "month", "year", "quarter"] }
      - name: ship_date
        sql: ship_date
        type: time
        description: Ship date
      - name: ship_mode
        sql: ship_mode
        type: string
        description: "Shipping method: Standard Class, Second Class, First Class, Same Day"
      - name: segment
        sql: segment
        type: string
        description: "Customer segment: Consumer, Corporate, Home Office"
        meta: { synonyms: ["segment", "customer group"] }
      - name: customer_name
        sql: customer_name
        type: string
        meta: { synonyms: ["customer name", "customer"] }
      - name: region
        sql: region
        type: string
        description: "Region: Central, East, South, West"
        meta: { synonyms: ["region", "area", "territory"] }
      - name: state
        sql: state
        type: string
        description: US state
        meta: { synonyms: ["state"] }
      - name: city
        sql: city
        type: string
        meta: { synonyms: ["city", "town"] }
      - name: category
        sql: category
        type: string
        description: "Product category: Furniture, Office Supplies, Technology"
        meta: { synonyms: ["category", "product type", "furniture", "office supplies", "technology"] }
      - name: sub_category
        sql: sub_category
        type: string
        description: "Product sub-category, e.g. Chairs, Phones, Binders"
        meta: { synonyms: ["sub-category", "product group"] }
      - name: product_name
        sql: product_name
        type: string
        meta: { synonyms: ["product", "product name", "item"] }

    pre_aggregations:
      - name: daily_by_geo_category
        measures: [total_sales, total_profit, total_quantity, line_count]
        dimensions: [segment, region, state, category, sub_category, ship_mode]
        time_dimension: order_date
        granularity: day
        partition_granularity: year
        refresh_key:
          every: 1 day
