# The view is the only surface the agent and Superset get to see.
views:
  - name: superstore_sales
    title: Superstore sales
    description: >
      Revenue, profit, quantity and orders of the Superstore US retail chain,
      orders 2014–2017, by time, region/state/city, customer segment and product category. Currency USD.
    cubes:
      - join_path: sales
        includes: "*"
        excludes:
          - row_id
