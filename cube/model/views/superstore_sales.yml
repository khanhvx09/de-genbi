# View là "bề mặt" duy nhất agent và Superset được thấy.
views:
  - name: superstore_sales
    title: Superstore sales
    description: >
      Doanh thu, lợi nhuận, số lượng, đơn hàng của chuỗi bán lẻ Superstore tại Mỹ,
      đơn hàng 2014–2017, theo thời gian, vùng/bang/thành phố, phân khúc khách hàng và ngành hàng. Tiền tệ USD.
    cubes:
      - join_path: sales
        includes: "*"
        excludes:
          - row_id
